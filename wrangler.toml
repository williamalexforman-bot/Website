name = "csrp"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The site's pages and files. Requests that don't match a file go to the worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Panel data lives in one SQLite-backed Durable Object (free plan friendly, nothing to create by hand).
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

# Keep the settings added in Cloudflare's dashboard when a new version deploys.
keep_vars = true
# Settings to add in the dashboard (Worker > Settings > Variables and Secrets):
#   Text:   DISCORD_GUILD_ID, STAFF_ROLE_IDS, HR_ROLE_IDS, OWNER_IDS   (comma-separated Discord ids)
#   Secret: DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, SESSION_SECRET, ERLC_SERVER_KEY, ANTHROPIC_API_KEY (optional)
