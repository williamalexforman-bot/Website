<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSRP Forms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-nav">
    <a class="brand" href="index.html"><span class="brand-mark">CS</span>California State Roleplay</a>
    <a class="btn" href="index.html">Home</a>
  </header>
  <main class="narrow">
    <div class="card pad" id="formCard"></div>
  </main>
  <div class="toast" id="toast"></div>
<script>
const FORMS = {
  "staff-application": {
    title: "Staff Application",
    intro: "Thanks for your interest in joining the CSRP staff team. Answer honestly and in full sentences.",
    q: [["Discord username","input"],["Roblox username","input"],["How old are you?","input"],["What time zone are you in?","input"],["Why do you want to join the staff team?","textarea"],["What does RDM mean, and how would you handle it?","textarea"],["Any previous staff experience?","textarea"]]
  },
  "appeals": {
    title: "Punishment Appeal",
    intro: "Appeal a warning, kick or ban. Be honest — false appeals are denied.",
    q: [["Roblox username","input"],["What punishment did you receive?","input"],["Why were you punished?","textarea"],["Why should it be removed?","textarea"]]
  },
  "staff-trainer-application": {
    title: "Staff Trainer Application",
    intro: "For current Moderators and above who want to train new staff.",
    q: [["Discord username","input"],["Current rank","input"],["How would you run a training session?","textarea"]]
  }
};
const slug = location.hash.slice(1) || new URLSearchParams(location.search).get("f") || "staff-application";
const f = FORMS[slug] || FORMS["staff-application"];
document.title = f.title + " · CSRP";
const card = document.getElementById("formCard");
card.innerHTML = `<h1 style="font-size:30px">${f.title}</h1><p class="muted" style="line-height:1.6">${f.intro}</p>
<form id="frm">${f.q.map(([l,t],i)=>`<label class="lbl" for="q${i}">${l}</label>${t==="textarea"?`<textarea class="input" id="q${i}" rows="4" required></textarea>`:`<input class="input" id="q${i}" required>`}`).join("")}
<button class="btn primary block" style="margin-top:24px;padding:13px">Submit</button></form>`;
document.getElementById("frm").addEventListener("submit", e => {
  e.preventDefault();
  card.innerHTML = `<h1 style="font-size:28px">Submitted</h1><p class="muted" style="line-height:1.6">Thanks! This is a demo site, so nothing was actually sent. Once a backend is connected, responses will show up in the staff panel.</p><a class="btn" href="index.html">Back home</a>`;
});
</script>
</body>
</html>
